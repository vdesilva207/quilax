[build]
  publish = "dist"
  command = "npx expo export -p web"
  # Force prod API so Netlify never bakes localhost into the wallet bundle.
  # Redeploy trigger: 2026-09-18 profile avatar + wallet gradient CTAs.
  environment = { NODE_ENV = "production", APP_ENV = "production", EXPO_PUBLIC_API_URL = "https://api.appquilax.com" }

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
