<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        overflow: hidden;
        background: #fffcf8;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      #boot {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        font-family: system-ui, -apple-system, sans-serif;
        color: #78716c;
      }
      #boot strong {
        font-size: 22px;
        font-weight: 800;
        color: #1c1917;
        letter-spacing: -0.02em;
      }
      #boot .spin {
        width: 36px;
        height: 36px;
        border: 3px solid #e7e5e4;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <div id="root">
      <div id="boot">
        <div class="spin" aria-hidden="true"></div>
        <strong>Quilax</strong>
        <span>Cargando… la primera vez puede tardar un minuto.</span>
      </div>
    </div>
  </body>
</html>
