version: '3.8'

services:
  # PostgreSQL con optimizaciones para 2M usuarios
  postgres:
    image: postgres:15-alpine
    container_name: quilax-postgres
    environment:
      POSTGRES_USER: quilax
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: quilax
      # Optimizaciones PostgreSQL para alta concurrencia
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=C"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres.conf:/etc/postgresql/postgresql.conf
    ports:
      - "5432:5432"
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    deploy:
      resources:
        limits:
          cpus: '8'
          memory: 32G
        reservations:
          cpus: '4'
          memory: 16G
    networks:
      - quilax-network

  # Redis para caching y sesiones
  redis:
    image: redis:7-alpine
    container_name: quilax-redis
    command: redis-server --maxmemory 8gb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - quilax-network

  # Backend API - Multiple instancias para horizontal scaling
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: quilax-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://quilax:${DB_PASSWORD}@postgres:5432/quilax
      REDIS_HOST: redis
      REDIS_PORT: 6379
      PORT: 3001
      # Optimizaciones Node.js
      NODE_OPTIONS: --max-old-space-size=4096
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3001"
    deploy:
      mode: replicated
      replicas: 8 # 8 instancias del backend
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    networks:
      - quilax-network

  # Nginx Load Balancer
  nginx:
    image: nginx:alpine
    container_name: quilax-nginx
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 4G
        reservations:
          cpus: '2'
          memory: 2G
    networks:
      - quilax-network

  # Prometheus para monitoreo
  prometheus:
    image: prom/prometheus:latest
    container_name: quilax-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      - quilax-network

  # Grafana para visualización
  grafana:
    image: grafana/grafana:latest
    container_name: quilax-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - quilax-network

  # Elasticsearch para logs
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.11.0
    container_name: quilax-elasticsearch
    environment:
      - discovery.type=single-node
      - "ES_JAVA_OPTS=-Xms4g -Xmx4g"
      - xpack.security.enabled=false
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    networks:
      - quilax-network

  # Kibana para visualización de logs
  kibana:
    image: docker.elastic.co/kibana/kibana:8.11.0
    container_name: quilax-kibana
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - quilax-network

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:
  elasticsearch_data:

networks:
  quilax-network:
    driver: bridge
