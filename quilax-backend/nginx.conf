# Configuración de Nginx para 2M usuarios concurrentes
# Load balancer optimizado para alta concurrencia

user nginx;
worker_processes auto; # Igual al número de CPUs
worker_rlimit_nofile 1000000; # Aumentar límite de archivos abiertos
worker_connections 100000; # 100K conexiones por worker
multi_accept on; # Aceptar múltiples conexiones a la vez

events {
    use epoll; # Mejor rendimiento en Linux
    worker_connections 100000;
    multi_accept on;
}

http {
    # Configuración básica
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # Optimizaciones de rendimiento
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 100000;
    types_hash_max_size 2048;
    
    # Buffer sizes
    client_body_buffer_size 128K;
    client_max_body_size 10M;
    client_header_buffer_size 1K;
    large_client_header_buffers 4 16K;
    output_buffers 1 32K;
    postpone_output 1460;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";
    
    # Cache de archivos estáticos
    open_file_cache max=200000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;
    
    # Logging
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;
    
    # Rate limiting
    limit_req_zone $binary_remote_addr zone=general:10m rate=1000r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=api:10m rate=500r/s;
    
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    
    # Upstream backend servers
    upstream backend {
        least_conn; # Balanceo por conexiones activas
        server backend1:3001 max_fails=3 fail_timeout=30s;
        server backend2:3001 max_fails=3 fail_timeout=30s;
        server backend3:3001 max_fails=3 fail_timeout=30s;
        server backend4:3001 max_fails=3 fail_timeout=30s;
        server backend5:3001 max_fails=3 fail_timeout=30s;
        server backend6:3001 max_fails=3 fail_timeout=30s;
        server backend7:3001 max_fails=3 fail_timeout=30s;
        server backend8:3001 max_fails=3 fail_timeout=30s;
        keepalive 1000; # Conexiones keepalive
    }
    
    # Upstream WebSocket servers
    upstream websocket {
        ip_hash; # Mismo usuario al mismo servidor para WebSockets
        server backend1:3001 max_fails=3 fail_timeout=30s;
        server backend2:3001 max_fails=3 fail_timeout=30s;
        server backend3:3001 max_fails=3 fail_timeout=30s;
        server backend4:3001 max_fails=3 fail_timeout=30s;
        server backend5:3001 max_fails=3 fail_timeout=30s;
        server backend6:3001 max_fails=3 fail_timeout=30s;
        server backend7:3001 max_fails=3 fail_timeout=30s;
        server backend8:3001 max_fails=3 fail_timeout=30s;
    }
    
    # Servidor principal
    server {
        listen 80;
        listen [::]:80;
        server_name api.quilax.com;
        
        # Redirección a HTTPS
        return 301 https://$server_name$request_uri;
    }
    
    # Servidor HTTPS
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name api.quilax.com;
        
        # SSL certificates
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # SSL optimizado
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        # Rate limiting general
        limit_req zone=general burst=2000 nodelay;
        limit_conn addr 100;
        
        # Health check endpoint
        location /health {
            access_log off;
            proxy_pass http://backend/health;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # API endpoints
        location /api/ {
            limit_req zone=api burst=1000 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }
        
        # Auth endpoints - más restrictivo
        location /api/auth/ {
            limit_req zone=auth burst=20 nodelay;
            
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        
        # WebSocket endpoint
        location /socket.io/ {
            proxy_pass http://websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }
        
        # Archivos estáticos con CDN
        location /static/ {
            alias /var/www/static/;
            expires 1y;
            add_header Cache-Control "public, immutable";
            access_log off;
        }
        
        # Media files
        location /media/ {
            alias /var/www/media/;
            expires 30d;
            add_header Cache-Control "public";
            access_log off;
        }
    }
    
    # Servidor para frontend (React Native web)
    server {
        listen 80;
        listen [::]:80;
        server_name www.quilax.com quilax.com;
        
        return 301 https://$server_name$request_uri;
    }
    
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name www.quilax.com quilax.com;
        
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        root /var/www/frontend;
        index index.html;
        
        # SPA routing
        location / {
            try_files $uri $uri/ /index.html;
        }
        
        # Archivos estáticos
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
        
        # Gzip para frontend
        gzip on;
        gzip_vary on;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types text/plain text/css text/xml text/javascript 
                   application/json application/javascript application/xml+rss;
    }
}
