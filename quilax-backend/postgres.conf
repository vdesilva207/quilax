# Configuración de PostgreSQL optimizada para 2M usuarios concurrentes

# CONEXIONES Y MEMORIA
max_connections = 50000              # 50K conexiones simultáneas
shared_buffers = 32GB               # 32GB de memoria compartida
effective_cache_size = 96GB         # 96GB de caché efectiva
work_mem = 256MB                    # 256MB por operación de ordenamiento
maintenance_work_mem = 2GB          # 2GB para operaciones de mantenimiento
dynamic_shared_memory_type = psql   # Tipo de memoria compartida dinámica

# WAL (Write-Ahead Log)
wal_buffers = 64MB                  # 64MB para WAL
min_wal_size = 4GB                 # 4GB mínimo de WAL
max_wal_size = 16GB                # 16GB máximo de WAL
wal_compression = on               # Compresión de WAL
wal_level = replica                 # Nivel de WAL para replicación

# CHECKPOINTING
checkpoint_completion_target = 0.9  # 90% de completión de checkpoint
checkpoint_timeout = 15min           # Timeout de checkpoint
checkpoint_warning = 30s            # Advertencia de checkpoint

# QUERY PLANNING
random_page_cost = 1.1             # Costo de página aleatoria
effective_io_concurrency = 200     # 200 operaciones I/O concurrentes
max_parallel_workers_per_gather = 8 # 8 workers por gather
max_parallel_workers = 16           # 16 workers paralelos máximos
max_parallel_maintenance_workers = 8 # 8 workers de mantenimiento

# AUTOMATIC VACUUM
autovacuum = on                     # Habilitar autovacuum
autovacuum_max_workers = 8          # 8 workers de autovacuum
autovacuum_naptime = 1s            # 1 segundo entre naps
autovacuum_vacuum_threshold = 1000  # 1000 tuplas para vacuum
autovacuum_analyze_threshold = 500  # 500 tuplas para analyze
autovacuum_vacuum_scale_factor = 0.1 # 10% de crecimiento
autovacuum_analyze_scale_factor = 0.05 # 5% para analyze

# LOGGING
logging_collector = on
log_destination = 'stderr'
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_timezone = 'UTC'
log_statement = 'mod'              # Log de statements modificados
log_duration = on                  # Log de duración
log_min_duration_statement = 1000  # Log de queries > 1s
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 10000             # Log de archivos temporales

# REPLICATION
max_wal_senders = 100              # 100 senders de WAL
max_replication_slots = 100        # 100 slots de replicación
hot_standby_feedback = on
hot_standby_feedback_interval = 10s

# STATISTICS
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
track_activity_query_size = 1024

# PERFORMANCE
synchronous_commit = off           # Para mayor rendimiento (con riesgo de pérdida de datos en crash)
commit_delay = 100                 # 100ms de delay para commits
full_page_writes = on
wal_log_hints = on

# PARALLELISM
parallel_tuple_cost = 0.01
parallel_setup_cost = 1000.0
min_parallel_table_scan_size = 8
min_parallel_index_scan_size = 2

# LOCK MANAGEMENT
deadlock_timeout = 5s
lock_timeout = 30s

# CLIENT CONNECTION
tcp_keepalives_idle = 60
tcp_keepalives_interval = 10
tcp_keepalives_count = 6

# BACKGROUND WRITER
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 1000
bgwriter_lru_multiplier = 2.0
